name: Madeira 0.1.1 iOS 18 experimental build
on:
  push:
    branches: [ios18-v011-build]
    paths: ['Madeira-v011-ios18-build.patch', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: willfaust/Madeira
          ref: ca3183ea3dfb0fd706aff1bea2abb871b5d27aec
          path: source
          persist-credentials: false
      - name: Apply reviewed source changes
        working-directory: source
        run: |
          git apply --check ../overlay/Madeira-v011-ios18-build.patch
          git apply ../overlay/Madeira-v011-ios18-build.patch
          mkdir -p artifacts
          cp ../overlay/Madeira-v011-ios18-build.patch artifacts/
      - name: Validate JIT allocator
        working-directory: source
        run: |
          set -o pipefail
          cc -std=c11 -Wall -Wextra -Werror tests/host/jit-legacy-test.c -o "$RUNNER_TEMP/jit-test"
          "$RUNNER_TEMP/jit-test"
          xcodebuild -version
          xcrun --sdk iphoneos clang -target arm64-apple-ios18.5 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -fsyntax-only app/Madeira/JITAllocator.c 2>&1 | tee artifacts/allocator-compile.log
      - uses: actions/cache@v4
        with:
          key: madeira-v011-ios18-macos15-bootstrap-v1-${{ hashFiles('overlay/Madeira-v011-ios18-build.patch') }}
          path: |
            source/toolchains
      - name: Build native libraries
        working-directory: source
        run: |
          set -o pipefail
          bash build/ci/bootstrap-native.sh 2>&1 | tee artifacts/native-build.log
      - name: Build and package unsigned IPA
        working-directory: source
        run: bash build/ci/build-unsigned-ipa.sh
      - name: Collect compiler errors
        if: always()
        working-directory: source
        run: |
          mkdir -p artifacts/compiler-errors
          find build -type f \( -name '*.err' -o -name 'err-*.txt' \) -exec cp {} artifacts/compiler-errors/ \;
          git diff --binary HEAD > artifacts/source-changes.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Madeira-v011-ios18-build-results
          path: source/artifacts/
          if-no-files-found: error
